services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dcms_core_app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres_secret@db:5432/dcms_db?schema=public
      - NEXTAUTH_SECRET=super_secret_session_key_dcms_desktop_os
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dcms_network

  db:
    image: postgres:16-alpine
    container_name: dcms_postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secret
      POSTGRES_DB: dcms_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dcms_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - dcms_network

volumes:
  postgres_data:
    driver: local

networks:
  dcms_network:
    driver: bridge
